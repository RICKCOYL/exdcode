<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MDzuri – Urgent Care</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: transparent;
      font-family: Arial, sans-serif;
      color: #34403b;
    }

    
.stage {
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 20px 10px;
}


    
.laptop {
    width: min(620px, 96%);
    position: relative;
    container-type: inline-size;
}


    .lid {
      width: 92%;
      margin: auto;
      padding: 18px 10px 10px;
      background: linear-gradient(
        135deg,
        #36383b,
        #111214 35%,
        #292b2e 80%,
        #090a0b
      );
      border: 2px solid #63666a;
      border-radius: 18px 18px 6px 6px;
      position: relative;
      box-shadow:
        inset 0 0 0 2px #0b0c0d,
        0 10px 30px #0002;
    }

    .camera {
      position: absolute;
      top: 7px;
      left: 50%;
      width: 6px;
      height: 6px;
      background: #162333;
      border: 1px solid #444b52;
      border-radius: 50%;
    }

    .screen {
      aspect-ratio: 16/10;
      background: #fff;

      overflow-y: auto;
      overflow-x: hidden;
      border-radius: 4px;
      scrollbar-width: thin;
      scrollbar-color: #8c8c8c #eee;
      -ms-overflow-style: auto;
      outline-offset: 0;
    }

    .screen img {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      object-fit: contain;
    }

    .screen::-webkit-scrollbar {
      width: 8px;
    }

    .screen::-webkit-scrollbar-thumb {
      background: #8c8c8c;
      border-radius: 999px;
    }

    .screen::-webkit-scrollbar-track {
      background: #eee;
    }

    .base {
      height: 18px;
      border-radius: 3px 3px 40% 40%;
      background: linear-gradient(#e5e7e9, #a7abb0 35%, #d7dade 60%, #777c82);
      border: 1px solid #8e949b;
      position: relative;
      box-shadow: 0 16px 22px #0002;
    }

    .notch {
      position: absolute;
      top: 0;
      left: 42%;
      width: 16%;
      height: 7px;
      background: linear-gradient(#858b91, #bec3c8);
      border-radius: 0 0 12px 12px;
    }

    .hint {
      margin: 25px 0 0;
      display: none;
      color: #69736d;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        background: transparent;
      }

      .stage {
        padding: 12px 8px 10px;
        border-radius: 0;
      }

      .laptop {
        width: min(620px, 96%);
      }

      .lid {
        padding: 12px 8px 8px;
        border-radius: 12px 12px 4px 4px;
      }

      .camera {
        top: 6px;
      }

      .base {
        height: 13px;
      }
    }
  </style>
</head>
